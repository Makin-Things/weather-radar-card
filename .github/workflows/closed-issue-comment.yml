name: "Closed Issue Comment"

# Nudge commenters on closed issues toward opening a fresh issue instead —
# closed threads are easy for maintainers to miss, and a comment there can
# sit unnoticed indefinitely (see #179 -> #223).

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  redirect:
    name: Redirect comment on closed issue
    runs-on: ubuntu-latest
    # issue_comment also fires for PR comments (PRs are issues under the
    # hood) — exclude those, and only act when the issue is closed. Skip
    # the bot's own comment to avoid re-triggering itself.
    if: >
      github.event.issue.state == 'closed' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // "Close with comment" fires issue_comment too, with no flag
            // distinguishing it from an independent later comment — so
            // the person closing the issue would otherwise get told to
            // go file a new one. Skip comments that land within a few
            // seconds of the issue closing; a genuine bump won't.
            const closedAt = new Date(context.payload.issue.closed_at).getTime();
            const commentAt = new Date(context.payload.comment.created_at).getTime();
            if (Math.abs(commentAt - closedAt) < 60_000) {
              console.log('Comment landed within 60s of the issue closing — likely the closing comment itself. Skipping.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "This issue is closed. If you're still seeing this, please open a new issue and link back here — closed threads are easy for maintainers to miss.",
            });
